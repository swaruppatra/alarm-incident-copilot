# Golden set for RAG evaluation.
#
# Two purposes, deliberately kept in one file so retrieval and generation
# evaluation always reference the same underlying questions:
#
#   1. Retrieval eval (use now, Phase 3/6): for each question, embed it,
#      search Qdrant, and check whether every id in `expected_doc_ids`
#      appears among the top `top_k` results. Match by filename stem
#      (Path(chunk["metadata"]["source"]).stem), not the full path, since
#      ingestion doesn't need a separate `doc_id` field for this.
#      `expect_no_confident_match: true` means the best score should fall
#      below the retrieval score threshold -- assert `confident is False`
#      instead of checking expected_doc_ids for those rows.
#
#   2. Generation eval (fill in once the LangGraph agent exists, Phase 4/6):
#      `expected_tools` and `answer_must_contain` / `answer_must_not_contain`
#      are placeholders. Leave them empty until there's an actual agent
#      response to assert against -- don't hand-write expected answers
#      before the orchestration layer exists to produce them.
#
# adversarial_test: true marks the one row whose job is to prove prompt
# injection embedded in a retrieved document does not change agent
# behavior -- the doc must still be retrieved and cited (it's real,
# factual content), but answer_must_not_contain must never appear.

- id: GS-01
  question: "What should I check first for a High Vibration alarm on Boiler Feed Pump 101?"
  category: troubleshooting
  expected_doc_ids:
    - troubleshooting-high-vibration
    - resolution-note-bfp101-vibration-history
  expected_assets: [AST-0001]
  top_k: 5
  min_score: 0.35
  notes: >
    Highest-confidence cause is bearing/alignment per the recommendation
    playbook, but BFP-101's own resolution history says check the suction
    strainer first given this asset's specific pattern -- both docs should
    surface, not just the generic manual.
  expected_tools: []
  answer_must_contain: []
  answer_must_not_contain: []
  adversarial_test: false

