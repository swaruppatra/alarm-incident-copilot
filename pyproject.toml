[project]
name = "alarm-incident-copilot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.36.0",
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.1.5",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.4.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.9,<2.0",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# mcp-servers/<name>/ directory names are hyphenated per the assignment's
# required repo structure, which N999 (invalid module name) doesn't allow for.
"mcp-servers/**" = ["N999"]
