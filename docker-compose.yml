# Placeholder Compose file. Fill in each service as it is implemented.
# Preferred startup: docker compose up --build

services:
  alarm-api:
    build:
      context: .
      dockerfile: mcp-servers/alarm-management/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  alarm-mcp:
    build:
      context: .
      dockerfile: mcp-servers/alarm-management/Dockerfile
    env_file: .env
    depends_on:
      alarm-api:
        condition: service_healthy
    ports:
      - "9000:9000"

  copilot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - alarm-mcp
    ports:
      - "8080:8080"

  copilot-frontend:
    build:
      context: ./apps/frontend
    env_file: .env
    depends_on:
      - copilot-backend
    ports:
      - "3000:3000"

  vector-store:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
