# Placeholder Compose file. Fill in each service as it is implemented.
# Preferred startup: docker compose up --build

services:
  alarm-api:
    build:
      context: .
      dockerfile: mcp-servers/alarm-management/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  alarm-mcp:
    build:
      context: .
      dockerfile: mcp-servers/alarm-management/Dockerfile
    env_file: .env
    environment:
      # Overrides .env's MCP_TRANSPORT=stdio (meant for local dev tools like
      # the MCP Inspector) — this container needs to be reachable over the
      # network from copilot-backend, which stdio can't do across containers.
      - MCP_TRANSPORT=streamable-http
      - ALARM_API_BASE_URL=http://alarm-api:8000
    depends_on:
      alarm-api:
        condition: service_healthy
    ports:
      - "9000:9000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -sf -o /dev/null -X POST http://localhost:9000/mcp
          -H 'Content-Type: application/json'
          -H 'Accept: application/json, text/event-stream'
          -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}}}'
      interval: 10s
      timeout: 5s
      retries: 5

  ticketing-api:
    build:
      context: .
      dockerfile: ticketing/Dockerfile
    env_file: .env
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticketing-mcp:
    build:
      context: .
      dockerfile: mcp-servers/ticketing/Dockerfile
    env_file: .env
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=9100
      - TICKETING_API_URL=http://ticketing-api:8100
    depends_on:
      ticketing-api:
        condition: service_healthy
    ports:
      - "9100:9100"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -sf -o /dev/null -X POST http://localhost:9100/mcp
          -H 'Content-Type: application/json'
          -H 'Accept: application/json, text/event-stream'
          -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}}}'
      interval: 10s
      timeout: 5s
      retries: 5

  copilot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      alarm-mcp:
        condition: service_healthy
      ticketing-mcp:
        condition: service_healthy
    ports:
      - "8080:8080"

  copilot-frontend:
    build:
      context: ./apps/frontend
    env_file: .env
    depends_on:
      - copilot-backend
    ports:
      - "3000:3000"

  vector-store:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./var/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
