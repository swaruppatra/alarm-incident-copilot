name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs uv and, via `uv sync` below, provisions the Python version
      # pinned by pyproject.toml's requires-python (3.11) if the runner
      # doesn't already have one -- same tool the Dockerfile images use, so
      # CI installs the exact dependency set (uv.lock) that's actually
      # tested/deployed, not a hand-picked subset.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests
        run: uv run pytest tests/integration

      # In-process against the real simulator app + real alarm-management
      # FastMCP server (ASGI transport, temp sqlite) -- no docker, no
      # secrets, safe to run on every push. See tests/e2e/conftest.py.
      - name: E2E tests (CHAIN-09 orchestration)
        run: uv run pytest tests/e2e

      - name: RAG tests
        run: uv run pytest rag/tests

      - name: Build validation
        run: |
          cp .env.example .env
          docker compose config
